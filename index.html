<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Phoenix Team — Переводы</title>
    <link rel="icon" type="image/svg+xml" href="phoenix-logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-decor"></div>
    <div class="phoenix-watermark"></div>

    <!-- Шапка -->
    <header class="top-header">
        <div class="header-logo">
            <img src="phoenix-logo.svg" alt="Phoenix" class="logo-icon">
            <h1>Fire Phoenix Team</h1>
        </div>
        <nav class="header-nav">
            <a href="index.html" class="active">Главная</a>
            <button class="theme-toggle" id="themeToggle" title="Сменить тему">🌙</button>
        </nav>
    </header>

    <!-- Сайдбар -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2>Навигация</h2>
            <p>быстрый доступ</p>
        </div>

        <div class="mascot-zone">
            <span class="mascot-emoji">🐾</span>
            <span class="mascot-note">тут спит бульдог...</span>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="sidebar-link active" data-status="all">Все переводы</a>
            <a href="#" class="sidebar-link" data-status="in_progress">В работе</a>
            <a href="#" class="sidebar-link" data-status="done">Готовые</a>
            <a href="#" class="sidebar-link" data-status="taken">Бронь</a>
            <a href="#" class="sidebar-link" data-status="free">Свободные</a>
        </nav>

        <div class="sidebar-stats">
            <div class="stat-item">
                <div class="stat-label">Всего</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Свободные</div>
                <div class="stat-value" id="statFree">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">В работе</div>
                <div class="stat-value" id="statProgress">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Занятые</div>
                <div class="stat-value" id="statTaken">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Завершённые</div>
                <div class="stat-value" id="statDone">0</div>
            </div>
        </div>
    </aside>

    <!-- Основной контент -->
    <main class="main-content">
        <div class="section-header">
            <div>
                <h2>ПЕРЕВОДЫ</h2>
                <span class="subtitle">архив команды ♪</span>
            </div>
        </div>

        <div class="status-filters">
            <button class="filter-btn active" data-status="all">Все</button>
            <button class="filter-btn" data-status="free">Свободен</button>
            <button class="filter-btn" data-status="in_progress">В работе</button>
            <button class="filter-btn" data-status="taken">Бронь</button>
            <button class="filter-btn" data-status="done">Готов</button>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Найти песню или исполнителя...">
        </div>

        <div class="translator-filters" id="translatorFilters">
            <button class="translator-btn active" data-translator="all">Все</button>
        </div>

        <div id="translationGroups"></div>

        <div class="empty-state" id="emptyState" style="display:none;">
            <span class="empty-emoji">🎵</span>
            <p>Ничего не найдено</p>
        </div>
    </main>

    <!-- Модалка с текстом перевода -->
    <div class="song-modal" id="songModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <h2 id="modalTitle"></h2>
            <p id="modalArtist" class="modal-artist"></p>
            <div class="modal-meta">
                <span id="modalTranslator" class="modal-translator"></span>
                <span id="modalStatus" class="item-status"></span>
            </div>
            <a id="modalUrl" class="modal-url" href="#" target="_blank" style="display:none;">🎵 Слушать оригинал</a>
            <button id="copyBtn" class="copy-btn" type="button">
                <span class="copy-icon">📋</span>
                <span class="copy-text">Скопировать текст</span>
            </button>
            <div id="modalLyrics" class="lyrics-content"></div>
        </div>
    </div>

    <script>
    (function() {
        const saved = localStorage.getItem('phoenix_theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('themeToggle');
            const updateIcon = () => {
                const t = document.documentElement.getAttribute('data-theme');
                btn.textContent = t === 'light' ? '🌙' : '☀️';
            };
            updateIcon();
            btn.addEventListener('click', () => {
                const cur = document.documentElement.getAttribute('data-theme');
                const next = cur === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('phoenix_theme', next);
                updateIcon();
            });
        });
    })();
    </script>
    <script src="app.js"></script>
</body>
</html>
