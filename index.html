<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переводы песен</title>
    <script>
        // Применяем сохранённую тему до первого рендера, чтобы избежать мигания
        (function () {
            try {
                var t = localStorage.getItem('phoenix-theme') || 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <h1>
        <img class="phoenix-logo" src="https://coreva-normal.trae.ai/api/ide/v1/text_to_image?prompt=elegant+white+phoenix+bird+with+ice+crystal+wings+snow+feathers+gold+accents+light+background+anime+style&image_size=square_hd" alt="Phoenix">
        Fire Phoenix Team — Переводы песен
    </h1>
    <nav>
        <a href="index.html">Главная</a>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Включить тёмную тему">
            <span class="theme-icon">🌙</span>
        </button>
    </nav>
</header>

<main>
    <div class="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="free">Свободен</button>
        <button class="filter-btn" data-filter="in_progress">В работе</button>
        <button class="filter-btn" data-filter="taken">Бронь</button>
        <button class="filter-btn" data-filter="done">Готов</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск по названию или исполнителю...">
    </div>

    <div id="translatorsList"></div>
</main>

<script src="songs.js"></script>
<script src="app.js"></script>
</body>
</html>
